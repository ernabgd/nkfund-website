title_ka: კონფიდენციალურობის პოლიტიკა
title_en: Privacy notice
body_ka: |-
  ეს ვებგვერდი ისეა შექმნილი, რომ თქვენს შესახებ რაც შეიძლება ნაკლები ინფორმაცია დამუშავდეს. ამ საიტს მართავს ააიპ ნიკო კვარაცხელიას სახელობის ფონდი.

  - საიტი არ იყენებს ქუქი-ფაილებს (cookies), ანალიტიკასა და თვალთვალის სხვა საშუალებებს. ის არ ტვირთავს მესამე მხარის სკრიპტებს, შრიფტებს ან ჩაშენებულ კონტენტს — ყველა ფაილი ამავე საიტიდან იტვირთება.
  - საიტზე არ არის ფორმები და ის პერსონალურ მონაცემებს არ აგროვებს.
  - საიტს მასპინძლობს GitHub Pages (GitHub, Inc.), რომელიც უსაფრთხოების მიზნით ინახავს ვიზიტორების IP მისამართებს. დაწვრილებით იხილეთ [GitHub-ის კონფიდენციალურობის განცხადება (ინგლისურად)](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).
  - თუ მოგვწერთ მისამართზე [hello@nkfund.world](mailto:hello@nkfund.world), თქვენს წერილსა და ელ. ფოსტის მისამართს მხოლოდ პასუხის გასაცემად გამოვიყენებთ და მესამე პირებს არ გადავცემთ.
  - საბანკო გადარიცხვისას გადარიცხვის მონაცემები (მაგალითად, გამგზავნის სახელი და ანგარიში) ხელმისაწვდომია ჩვენთვის და ჩვენი ბანკისთვის, სს „საქართველოს ბანკისთვის“ — გადახდის შესასრულებლად და კანონის მოთხოვნების შესაბამისად.
  - ბმულები Facebook-სა და Instagram-ზე ამ სერვისების გვერდებზე გადაგიყვანთ. მათ საკუთარი კონფიდენციალურობის პოლიტიკა აქვთ.

  შეგიძლიათ გვკითხოთ, რა ინფორმაციას ვინახავთ თქვენს შესახებ, და მოითხოვოთ მისი გასწორება ან წაშლა. მოგვწერეთ: [hello@nkfund.world](mailto:hello@nkfund.world).

  ამ ტექსტს განვაახლებთ, თუ საიტის მუშაობაში რაიმე შეიცვლება.
body_en: |-
  This website is designed to process as little information about you as possible. It is run by the Niko Kvaratskhelia Foundation (NNLE Niko Kvaratskhelias Sakhelobis Phondi).

  - The site uses no cookies, no analytics and no other tracking. It loads no third-party scripts, fonts or embedded content: every file comes from this website.
  - The site has no forms and does not collect personal data.
  - The site is hosted by GitHub Pages (GitHub, Inc.), which logs visitors’ IP addresses for security purposes. For details, see [GitHub’s privacy statement](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).
  - If you write to us at [hello@nkfund.world](mailto:hello@nkfund.world), we use your message and email address only to reply, and we do not pass them on.
  - If you donate by bank transfer, the transfer details (such as the sender’s name and account) are available to us and to our bank, JSC Bank of Georgia, to carry out the payment and as required by law.
  - Links to Facebook and Instagram take you to those services, which have their own privacy policies.

  You can ask us what information we hold about you and ask us to correct or delete it. Write to us at [hello@nkfund.world](mailto:hello@nkfund.world).

  We will update this notice if anything about how the site works changes.
description_ka: "როგორ ეკიდება ეს საიტი თქვენს მონაცემებს: ქუქი-ფაილების, ანალიტიკისა და თვალთვალის გარეშე."
description_en: "How this website treats your data: no cookies, no analytics, no tracking."
