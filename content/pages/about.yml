title_ka: ჩვენ შესახებ
title_en: About us
description_ka: ვინ დააარსა ნიკო კვარაცხელიას ფონდი, რას ემსახურება ის და როგორ იღებს გადაწყვეტილებებს.
description_en: Who founded the Nico Kvaratskhelia Fund, what it stands for and how it makes decisions.
body_ka: |-
  ნიკო კვარაცხელიას ფონდი დაარსდა 2022 წლის იანვარში. ფონდი შეიქმნა მისი ოჯახის წევრების და მეგობრების მიერ.

  ნიკოს სახელს უკავშირდება არაერთი ინოვაციური პროექტი. მან შექმნა ლოკაციაზე დაფუძნებული პლატფორმა Feedc, რომლითაც დაამსხვრია მითი და დაამტკიცა რომ გლობალური პროექტები შესაძლებელია შეიქმნას ისეთ პატარა ქვეყანაში როგორიც არის საქართველო და მოიცვას მთელი მსოფლიო.

  ნიკო გლობალური ხედვის ადამიანი იყო და თავისი ღირებულებებით თანხვედრაში იმ მდგრადი განვითარების 17 მიზანთან, რაც ამჟამად მსოფლიო დღის წესრიგშია. შესაბამისად, ნიკოს ფონდიც მოემსახურება მდგრადი განვითარების მიზნებს, იმისათვის, რომ ახალგაზრდებს შეეძლოთ უკეთესი და უფრო მდგრადი მომავლის შექმნა. ფონდის მიზანია მიყვეს ნიკოს ხედვას და ხელი შეუწყოს ახალგაზრდებს მათი შესაძლებლობების რეალიზაციაში. ამისათვის, ფონდი მხარს დაუჭერს ინოვაციურ პროექტებსა და განათლებაზე ორიენტირებულ ინიციატივებს.

  ფონდი პროექტების ხელშეწყობის და დაფინანსების გადაწყვეტილებას მიიღებს ხმათა უმრავლესობით. გამგეობაში არიან გაერთიანებული წარმატებული ადამიანები სხვადასხვა სფეროდან. სრულიად უცხო ადამიანებმაც კი გამოთქვეს ინიციატივა გვერდში დადგომოდნენ ნიკოს ფონდის მიერ განსახორციელებელ პროექტებს.
body_en: |-
  The Nico Kvaratskhelia Fund was founded in January 2022. It was set up by Nico’s family and friends.

  Nico’s name is linked to many innovative projects. He created Feedc, a location-based platform, and with it he shattered a myth, proving that global projects can be created in a country as small as Georgia and can reach the whole world.

  Nico was a person of global vision, and his values were in line with the 17 Sustainable Development Goals that are now on the world’s agenda. Accordingly, Nico’s Fund will also serve the Sustainable Development Goals, so that young people can create a better and more sustainable future. The Fund’s aim is to follow Nico’s vision and to help young people realise their potential. To this end, the Fund will support innovative projects and education-focused initiatives.

  The Fund decides by majority vote which projects to support and fund. Its board brings together successful people from various fields. Even complete strangers have come forward, offering to stand by the projects that Nico’s Fund will carry out.
