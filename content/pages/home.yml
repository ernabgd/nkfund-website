hero:
  title_ka: ნიკო კვარაცხელიას ფონდი
  title_en: Nico Kvaratskhelia Fund
  tagline_ka: ერთად განვახორციელოთ მომავლის პროექტები
  tagline_en: Together, let’s bring the projects of the future to life
quote:
  image: /assets/uploads/pages/niko-portrait.jpg
  image_alt_ka: ნიკო კვარაცხელიას პორტრეტი
  image_alt_en: Portrait of Nico Kvaratskhelia
  text_ka: |-
    ხშირად ვფიქრობ, როგორ გაგვიმართლა ჩვენ, იმ მცირე პროცენტს ახალგაზრდების, ვისაც გვაქვს საშუალება ხარისხიანი განათლება მივიღოთ.

    ბევრს ვფიქრობ იმ ბავშვებზე, ვისაც წარმოდგენაც კი არ აქვთ რა ხდება მსოფლიოში.

    ძალიან ბევრი იდეა მაქვს ამ მიმართულებით. მინდა ისეთი პროექტები გავაკეთო, სადაც რეგიონში მცხოვრები ახალგაზრდები იქნებიან ჩართულები.
  text_en: |-
    I often think about how lucky we are — the small percentage of young people who have the opportunity to receive a quality education.

    I think a lot about the children who don’t even know what is happening in the world.

    I have so many ideas about this. I want to create projects that involve young people who live in the regions.
  attribution_ka: ნიკო კვარაცხელია
  attribution_en: Nico Kvaratskhelia
  role_ka: Feedc-ის შემქმნელი
  role_en: Creator of Feedc
goal:
  heading_ka: ჩვენი მიზანი
  heading_en: Our goal
  body_ka: |-
    ფონდის მიზანია მიყვეს ნიკოს ხედვას და ხელი შეუწყოს ახალგაზრდებს მათი შესაძლებლობების რეალიზაციაში. ამისათვის, ფონდი მხარს დაუჭერს ინოვაციურ პროექტებსა და განათლებაზე ორიენტირებულ ინიციატივებს.

    ნიკო გლობალური ხედვის ადამიანი იყო და თავისი ღირებულებებით თანხვედრაში იმ მდგრადი განვითარების 17 მიზანთან, რაც ამჟამად მსოფლიო დღის წესრიგია. შესაბამისად, ნიკოს ფონდიც მოემსახურება მდგრადი განვითარების მიზნებს, იმისათვის, რომ ახალგაზრდებს შეეძლოთ უკეთესი და უფრო მდგრადი მომავლის შექმნა.
  body_en: |-
    The Fund’s aim is to follow Nico’s vision and to help young people realise their potential. To this end, the Fund will support innovative projects and education-focused initiatives.

    Nico was a person of global vision, and his values were in line with the 17 Sustainable Development Goals that are now on the world’s agenda. Accordingly, Nico’s Fund will also serve the Sustainable Development Goals, so that young people can create a better and more sustainable future.
  video: /assets/video/film-720p.mp4
  poster: /assets/video/film-poster.webp
  subtitles_en: /assets/video/film.en.vtt
  captions_ka: ""
  transcript_ka: ""
  transcript_en: |-
    *Transcribed word for word from the film’s English subtitles; the names and roles are from the captions on screen (in Georgian). Descriptions of what is shown are in square brackets.*

    **Iza Omadze, Niko Kvaratskhelia’s mother:** Since his childhood, Niko has been the author of a number of social projects, some of which he could not complete. The Nikos Foundation will serve to complete these projects.

    [A young man in a Feedc T-shirt shows the Feedc app on a phone; on screen: “No followers”, “No friend requests”.]

    Niko had no boundaries, that’s what his created platform Feedc served. With the platform, it allowed people to write what they wanted and get the information they were interested in.

    [On screen: Forbes Georgia, “FORBES 30/30 – <span lang="ka">ქართული გლობალური ქსელი</span>” (Georgian global network).]

    The started things did not stop. For our family, it was everyday. We decided to gather in one space for all these things and united all this under the Nikos Foundation.

    **Ana (Erna) Bagdasarova, director of Feedc:** In the conditions of the pandemic, Niko and the Feeds team were able to quickly create the first Georgian free distance learning platform Feedc Edu. Due to the global situation, it is very important to support people who are focused on getting an education. Therefore, Feedc Edu and Nikos Foundation share one goal: a better and sustainable future.

    [Nico on stage, presenting Feedc.]

    **Bidzina Gonashvili, founder of Tserti:** It’s true that I come from a different field, but Niko’s innovation, attitude, purposefulness were contagious to everyone. I liked what he was doing with Feeds, the general concept that there are no borders and anyone can go global. I am proud that we were on the Forbes list of under 30 together and I believe that it has become an example for many young people.

    **Sandro Kandelaki, digital transformation expert:** Due to the fact that I have been working in the digital world for years and my skills are based on a number of innovations, Niko was a clear example for me of how, despite the fact that Georgia is a small country at least in Georgia, a person created an innovative product and globalized it. Niko was the best example of this and I am very happy that together with Niko I became the winner of Forbes under 30.

    **Vera Kvaratskhelia, pupil at the Jgali public school:** For years, the young people of Jgali village dreamed of an IT room equipped with modern technologies. Niko turned out to be the person who made our dream a reality and just a few months ago an IT room named after Niko Kvaratskhelia was opened in the public school of Jgali village.

    [Pupils at laptops in the new IT room.]

    **Baia Abuladze, winemaker:** I, as a representative of Niko’s generation and also a person who was with him among the Forbes under 30 winners, I am really proud of his job, which was presented in Georgia and beyond its borders.

    [Nico on stage in front of a Feedc screen and a “Here and now” banner.]

    **Saba Kalandia, Graneli Scholarship holder:** It is a great honor for me that this scholarship is financed by the Niko’s Foundation. Niko is a great motivation for me and I hope Georgia will have someone like him again.

    **Iza Omadze:** All the social projects that our family has been doing until now will be implemented by the Nikos Foundation.

    [The nkfund. logo and the address www.nkfund.world.]
