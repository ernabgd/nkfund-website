privacy:
  status: "DRAFT - written for the rebuild, not yet approved by the foundation. Show the draft banner until the owner approves it."
  title:
    ka: "კონფიდენციალურობის პოლიტიკა"
    en: "Privacy notice"
    src: new
  draft_banner:
    ka: "სამუშაო ვერსია — ტექსტი ფონდის მიერ ჯერ არ არის დამტკიცებული."
    en: "Draft — this text has not yet been approved by the foundation."
    src: new
  intro:
    ka: "ეს ვებგვერდი ისეა შექმნილი, რომ თქვენს შესახებ რაც შეიძლება ნაკლები ინფორმაცია დამუშავდეს."
    en: "This website is designed to process as little information about you as possible."
    src: new
  sections:
    - key: "who"
      heading:
        ka: "ვინ ვართ"
        en: "Who we are"
      text:
        ka: "ამ საიტს მართავს ააიპ ნიკო კვარაცხელიას სახელობის ფონდი."
        en: "This website is run by the Niko Kvaratskhelia Foundation (NNLE Niko Kvaratskhelias Sakhelobis Phondi)."
    - key: "cookies"
      heading:
        ka: "ქუქი-ფაილები და თვალთვალი"
        en: "Cookies and tracking"
      text:
        ka: "საიტი არ იყენებს ქუქი-ფაილებს (cookies), ვიზიტების ანალიტიკას, სარეკლამო ან თვალთვალის ხელსაწყოებს და არ ტვირთავს მესამე მხარის სკრიპტებს. შრიფტები, ფოტოები და ვიდეოები განთავსებულია თავად საიტზე. მთავარ გვერდზე ნაჩვენები Facebook-ის პოსტები ამ საიტზეა გადმოტანილი, ამიტომ მათი ნახვისას Facebook-იდან არაფერი იტვირთება."
        en: "The site does not use cookies, visitor analytics, advertising or tracking tools, and it loads no third-party scripts. Fonts, photos and videos are served from the site itself. The Facebook posts shown on the home page are copied to this site, so viewing them loads nothing from Facebook."
      note: "The last sentence is true only if imported post images are stored on the site (not hot-linked from Facebook). Remove it otherwise."
    - key: "data"
      heading:
        ka: "რა მონაცემებს ვაგროვებთ"
        en: "What we collect"
      text:
        ka: "საიტზე არ არის ფორმები, მომხმარებლის ანგარიშები ან საინფორმაციო ბიულეტენი, ამიტომ საიტის მეშვეობით პერსონალურ მონაცემებს არ ვაგროვებთ."
        en: "The site has no forms, user accounts or newsletter, so we do not collect personal data through it."
    - key: "hosting"
      heading:
        ka: "ჰოსტინგი"
        en: "Hosting"
      text:
        ka: "საიტს მასპინძლობს GitHub Pages (GitHub, Inc.). ნებისმიერი ვებსერვერის მსგავსად, GitHub-ი უსაფრთხოების მიზნით ამუშავებს ტექნიკურ მონაცემებს, მაგალითად, თქვენს IP მისამართს. დაწვრილებით იხილეთ GitHub-ის კონფიდენციალურობის განცხადება."
        en: "The site is hosted on GitHub Pages (GitHub, Inc.). Like any web server, GitHub processes technical data, such as your IP address, for security purposes. For details, see GitHub’s privacy statement."
      link:
        ka: "GitHub-ის კონფიდენციალურობის განცხადება"
        en: "GitHub’s privacy statement"
        url: "https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"
      optional_cloudflare:
        ka: "საიტზე შემოსული მოთხოვნები Cloudflare-ის ქსელშიც გადის, რომელიც ასევე ამუშავებს ტექნიკურ მონაცემებს უსაფრთხოებისა და საიტის მიწოდების მიზნით."
        en: "Requests to the site also pass through Cloudflare’s network, which likewise processes technical data for security and delivery."
        note: "Add only if the domain is proxied through Cloudflare (orange cloud). DNS-only does not need it."
    - key: "donations"
      heading:
        ka: "შემოწირულობები"
        en: "Donations"
      text:
        ka: "შემოწირულობა შესაძლებელია მხოლოდ საბანკო გადარიცხვით. გადახდის მონაცემებს ამუშავებენ თქვენი და ფონდის ბანკები; ფონდი ხედავს მხოლოდ იმას, რაც მის საბანკო ამონაწერში აისახება (მაგალითად, გამგზავნის სახელს, თანხასა და გადახდის დანიშნულებას). ამ ინფორმაციას ვიყენებთ მხოლოდ შემოწირულობის აღრიცხვისა და კანონით დადგენილი ვალდებულებების შესასრულებლად."
        en: "Donations are made by bank transfer only. Your bank and the foundation’s bank process the payment details; the foundation sees only what appears on its bank statement (such as the sender’s name, the amount and the purpose of payment). We use this information only to record the donation and to meet our legal obligations."
      note: "Owner to confirm the last sentence describes what the foundation actually does."
    - key: "email"
      heading:
        ka: "ელ. ფოსტა"
        en: "Email"
      text:
        ka: "თუ მოგვწერთ მისამართზე {email}, თქვენს წერილსა და ელ. ფოსტის მისამართს გამოვიყენებთ მხოლოდ პასუხის გასაცემად."
        en: "If you write to us at {email}, we use your message and email address only to reply to you."
    - key: "social"
      heading:
        ka: "სოციალური ქსელები"
        en: "Social media"
      text:
        ka: "Facebook-ისა და Instagram-ის ბმულები გადაგიყვანთ ამ სერვისებზე, რომლებსაც საკუთარი კონფიდენციალურობის წესები აქვთ."
        en: "Links to Facebook and Instagram take you to those services, which have their own privacy policies."
    - key: "rights"
      heading:
        ka: "თქვენი უფლებები"
        en: "Your rights"
      text:
        ka: "შეგიძლიათ გვკითხოთ, რა ინფორმაციას ვინახავთ თქვენს შესახებ, და მოითხოვოთ მისი გასწორება ან წაშლა. მოგვწერეთ: {email}."
        en: "You can ask us what information we hold about you and ask us to correct or delete it. Write to us at {email}."
    - key: "changes"
      heading:
        ka: "ცვლილებები"
        en: "Changes"
      text:
        ka: "ამ ტექსტს განვაახლებთ, თუ საიტის მუშაობაში რაიმე შეიცვლება."
        en: "We will update this notice if anything about how the site works changes."
  updated:
    ka: "ბოლო განახლება: {date}"
    en: "Last updated: {date}"
    src: new
  missing_for_final_version: "Registration (identification) code of the foundation - not provided; add it to section ‘who’ when available."

