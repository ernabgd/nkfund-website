# nkfund.world - interface strings in Georgian (ka, default, at /) and English (en, at /en/).
# Written 2026-10-20 for the static rebuild.
#
# Format: every leaf string is a map with `ka` and `en`. Optional fields:
#   src: old   = the Georgian string existed on the Wix site (exact text, spelling fixes applied)
#   src: new   = Georgian written for the rebuild; a native Georgian proof-reader should check it
#   note:      = guidance for builders (not shown on the site)
# Placeholders in {curly braces} are filled by the templates: {year} {email} {title} {date} {label} {n} {total} {size}.
# Typography: Georgian quotes are „…“, English quotes are “…” and ’ (typographic apostrophe).
# English uses British spelling (realise, organise). Titles use sentence case.
# The owner defaults from the project brief are already applied in this file (no online payment,
# © 2022–{year}, contact email + Facebook + Instagram, privacy notice draft, publish the mission).

