    label: "Online transfer"
    href_new: "/donate/"
    href_old: "/donate"
  button_status: "obsolete - online payment no longer available"
  notes:
    - "Shared \"join us\" block, identical on Home, About, Our Projects, News, and every project / news item page (Wix section copies)."
    - "Layout (desktop): full-width black band with heading; below it a 2-column row: left = cover image media/images/nkfund-cover-logo.jpg (3f8517_b4fdd6c7…, nkfund. logo on light grey); right column on a dark stock background image (11062b_9b292a91… \"Dark-Background\", Wix stock, NOT reusable) with the text, a download icon + underlined link \"რეკვიზიტები\" to the bank PDF, a divider, the pill button \"ონლაინ გადარიცხვა\" (-> /donate) and card-brand logos (Visa / Mastercard / Amex, media/svg/payment-card-logos.svg) that also link to the PDF."
    - "Online card payment is no longer available (owner: the payment account was closed). The \"ონლაინ გადარიცხვა\" button and the card logos are obsolete; bank transfer (bank.yml) is the donation method."
