    identity: app
media:
  - name: uploads
    label: სურათები და ფაილები / Images and files
    input: src/assets/uploads
    output: /assets/uploads
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - gif
      - pdf
  - name: facebook
    label: Facebook-ის სურათები (ავტომატური) / Facebook images (automatic)
    input: src/assets/facebook
    output: /assets/facebook
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - gif
