            description: "შემომწირველები ამას ბანკის ფორმაში აკოპირებენ: არ თარგმნოთ და არ შეცვალოთ. / Donors copy this into their bank form: never translate or reformat it."
          - name: beneficiary_en
            label: მიმღები (ზუსტად როგორც ბანკის დოკუმენტში) / Beneficiary (exactly as in the bank document) — ინგლისურად / English
